name: Test & Deploy

# Every push: build + run the full test suite. On the production branch, a green
# suite then auto-deploys to the droplet over SSH. Deploy is skipped (with a
# notice) until the one-time DEPLOY_* secrets are configured in repo settings.

on:
  push:
    branches: ["claude/oppsignal-saas-build-57zc76"]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build backend/OppSignal.sln -c Release
      - name: Unit tests
        run: dotnet test backend/tests/OppSignal.UnitTests/OppSignal.UnitTests.csproj -c Release --no-build
      - name: Integration tests (Testcontainers Postgres)
        run: dotnet test backend/tests/OppSignal.IntegrationTests/OppSignal.IntegrationTests.csproj -c Release --no-build

  frontend-build:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm run test
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to droplet
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::DEPLOY_HOST / DEPLOY_SSH_KEY secrets not set — tests passed, deploy skipped."
            echo "One-time setup: add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY under Settings → Secrets and variables → Actions."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "${DEPLOY_USER:-root}@$DEPLOY_HOST" \
              'cd /opt/ContractCanary && git pull --ff-only && docker compose -f docker-compose.server.yml up -d --build && docker compose -f docker-compose.server.yml ps'
          echo "Deployed $GITHUB_SHA to $DEPLOY_HOST"
